name: CMake CI

on:
  schedule:
    - cron: '15 21 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# =========================================================
# Windows (MSVC)
# =========================================================
jobs:
  build_msvc:
    name: MSVC 2022 (${{ matrix.libtype }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        libtype: [shared, static]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ninja
        shell: pwsh
        run: python -m pip install --upgrade pip ninja

      - name: Select MSVC toolset
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $shared = if ("${{ matrix.libtype }}" -eq "shared") { "ON" } else { "OFF" }
          cmake -S . -B builddir_msvc_${{ matrix.libtype }} `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DFOSSIL_TEST_WITH_TESTS=ON `
            -DFOSSIL_TEST_BUILD_SHARED=$shared `
            -DCMAKE_C_FLAGS="/W3" `
            -DCMAKE_CXX_FLAGS="/W3"

      - name: Build
        run: cmake --build builddir_msvc_${{ matrix.libtype }} --config Release

      - name: Test
        run: >
          ctest
          --test-dir builddir_msvc_${{ matrix.libtype }}
          -C Release
          -V
          --output-on-failure

# =========================================================
# macOS
# =========================================================
  build_macos:
    name: macOS (${{ matrix.libtype }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        libtype: [shared, static]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python -m pip install --upgrade pip ninja

      - name: Configure
        run: |
          SHARED=OFF
          if [ "${{ matrix.libtype }}" = "shared" ]; then SHARED=ON; fi
          cmake -S . -B builddir_${{ matrix.libtype }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOSSIL_TEST_WITH_TESTS=ON \
            -DFOSSIL_TEST_BUILD_SHARED=${SHARED} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-Wall -Wextra" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build builddir_${{ matrix.libtype }}

      - name: Test
        run: >
          ctest
          --test-dir builddir_${{ matrix.libtype }}
          -V
          --output-on-failure

# =========================================================
# Linux (native runners — no Meson Docker images required)
# =========================================================
  build_linux:
    name: Linux ${{ matrix.os }} (${{ matrix.libtype }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        libtype: [shared, static]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
          python -m pip install --upgrade pip

      - name: Configure
        run: |
          SHARED=OFF
          if [ "${{ matrix.libtype }}" = "shared" ]; then SHARED=ON; fi
          cmake -S . -B builddir_${{ matrix.libtype }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOSSIL_TEST_WITH_TESTS=ON \
            -DFOSSIL_TEST_BUILD_SHARED=${SHARED} \
            -DCMAKE_C_FLAGS="-Wall -Wextra" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build builddir_${{ matrix.libtype }}

      - name: Test
        run: >
          ctest
          --test-dir builddir_${{ matrix.libtype }}
          -V
          --output-on-failure